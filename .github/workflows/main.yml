name: Build HALAL CHICKEN SHOP HANTI APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout updated source code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Find Android project
    id: project
    shell: bash
    run: |
      FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
        -not -path '*/.gradle/*' | head -n 1)
      if [ -z "$FILE" ]; then
        echo "Android Gradle project not found"
        exit 1
      fi
      echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

  - name: Build debug APK
    shell: bash
    run: |
      cd "${{ steps.project.outputs.dir }}"
      chmod +x ./gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HALAL-CHICKEN-SHOP-HANTI-APK
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 7
