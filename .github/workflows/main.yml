name: Build HALAL CHICKEN SHOP HANTI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | head -300
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HALAL-CHICKEN-SHOP-HANTI-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
